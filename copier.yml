# 20261030 gjw Copier template for the per-app files of Graham's Flutter
# apps. Answers are recorded in each app's .copier-answers.yml, and
# `copier update` brings template changes in with a three-way merge,
# keeping what was changed locally in the app.

_subdirectory: template
_templates_suffix: .j2
_answers_file: .copier-answers.yml
# 20261030 gjw Jinja comments are {## ##} rather than {# #}, which Inno
# Setup uses for its own {#Define} references in app-windows.iss.

_envops:
  keep_trailing_newline: true
  trim_blocks: true
  lstrip_blocks: true
  comment_start_string: "{##"
  comment_end_string: "##}"

# 20261030 gjw An app gets the installer files (snap/, flatpak/,
# installers/); a package gets only the files common to both.

kind:
  type: str
  help: An app, or a package published to pub.dev.
  choices: [app, package]
  default: app

# 20261030 gjw The android gradle files keep the gradle, AGP and kotlin
# versions in step across the apps. Only for an app that builds for
# android.

android:
  type: bool
  help: Does it build for android?
  default: "{{ kind == 'app' }}"

app:
  type: str
  help: The pubspec name, also the command and package name.
  default: "{{ _copier_conf.dst_path | basename }}"

owner:
  type: str
  help: The GitHub owner of the app's repository.
  default: gjwgit

publisher:
  type: str
  help: The publisher in the Windows installer.
  default: Togaware Pty Ltd

# 20261030 gjw The year and owner for license.dart, as the app has it:
# "2026, Togaware Pty Ltd" or "2025, Software Innovation Institute ANU".

copyright:
  type: str
  help: The copyright year and owner for license.dart.
  default: "2026, Togaware Pty Ltd"

name:
  type: str
  help: Display name, for desktop entries, AppStream and the Windows installer.

summary:
  type: str
  help: One line, no full stop.

comment:
  type: str
  help: The desktop entry Comment.

description:
  type: str
  multiline: true
  help: Paragraphs separated by a blank line.

categories:
  type: yaml
  default: []

keywords:
  type: yaml
  default: []

# 20261030 gjw Where `make ginstall` puts the installers: the host, its
# folder, and the URL they are downloaded from. prod says whether the
# web build is installed too. rattle is the exception, on togaware.com.

install:
  type: yaml
  default:
    host: solidcommunity.au
    folder: /var/www/html/web/installers/
    url: https://solidcommunity.au/installers/
    prod: true

# 20261031 gjw stores says which stores INSTALL.md links to, at their
# usual URLs for the app: play (the Google Play Store, else "coming
# soon") and snap (the Snap Store, else left out).

stores:
  type: yaml
  default: {}

# 20261030 gjw build.secrets names the GitHub repository secrets the
# installers workflow passes, by these names, to
# support/scramble_defines.dart, which scrambles them into
# dart_defines.json for every release build (radiopod's Podcast Index
# pair), so they are obfuscated in the binary rather than plain text.

build:
  type: yaml
  default: {}

deb:
  type: yaml
  default: {}

snap:
  type: yaml
  default: {}

# 20261030 gjw Leave flatpak unset for an app without a Flatpak, and the
# flatpak/ folder is not created. {} gives the plain Flatpak; it may add
# finish-args, modules (files in flatpak/) and icon (default
# snap/gui/icon.png, which must be square and at most 512x512).

flatpak:
  type: yaml
  default: null

# 20261030 gjw windows.appid, a GUID from `uuidgen`, gives the Inno Setup
# installers/app-windows.iss. It must never change once released.

windows:
  type: yaml
  default: {}
